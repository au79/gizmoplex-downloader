name: Publish Docker image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish au79/gizmoplex-downloader
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: au79/gizmoplex-downloader
          tags: |
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan published image with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: registry://au79/gizmoplex-downloader:${{ steps.meta.outputs.version }}
          only-severities: critical,high

      - name: Smoke test published image
        shell: bash
        env:
          IMAGE: au79/gizmoplex-downloader:${{ steps.meta.outputs.version }}
        run: |
          archive_dir="$RUNNER_TEMP/gizmoplex-archive"
          mkdir -p "$archive_dir"
          help_output="$(docker run --rm \
            --env GIZMOPLEX_EMAIL=smoke@example.test \
            --env GIZMOPLEX_PASSWORD=not-a-real-secret \
            --volume "$archive_dir:/archive" \
            "$IMAGE" --help)"
          printf '%s\n' "$help_output"
          grep -q -- '--out <dirpath>' <<< "$help_output"
