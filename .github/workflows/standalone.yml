name: Standalone binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-14
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.14.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone binary
        run: pnpm run build:standalone

      - name: Smoke test standalone binary
        shell: bash
        run: |
          binary="dist/standalone/gizmoplex-downloader-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            binary="${binary}.exe"
          fi
          "$binary" --help

      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.target }}
          path: dist/standalone/
          if-no-files-found: error
          retention-days: 14
